const SIZE = 64;
window.RESULT = {};
const out = document.getElementById('out');

function render(name, d) {
  return new Promise(resolve => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${SIZE}" height="${SIZE}">`
              + `<path fill="#ffffff" fill-rule="evenodd" d="${d}"/></svg>`;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = SIZE;
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = 'high';
      g.drawImage(img, 0, 0, SIZE, SIZE);
      out.appendChild(c);
      const lab = document.createElement('span');
      lab.textContent = name;
      out.appendChild(lab);
      window.RESULT[name] = c.toDataURL('image/png').split(',')[1];
      resolve();
    };
    img.onerror = () => { window.RESULT[name] = 'ERROR'; resolve(); };
    img.src = 'data:image/svg+xml;base64,' + btoa(svg);
  });
}

(async () => {
  for (const [name, d] of Object.entries(ICONS)) await render(name, d);
  window.DONE = true;
  document.title = 'done ' + Object.keys(window.RESULT).length;
})();
